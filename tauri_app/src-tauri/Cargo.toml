[package]
name = "cecdesk"
version = "1.1.0-beta.1"
description = "CecDesk App (Windows & Linux / SteamOS)"
authors = ["CecDesk Contributors"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/mitrafun-creator/CecDesk"
edition = "2021"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.5"
flate2 = "1.1"
crc32fast = "1.5"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_Graphics_Gdi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
