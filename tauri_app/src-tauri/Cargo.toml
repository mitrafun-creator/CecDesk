[package]
name = "hdmi_cec_studio"
version = "1.1.0-beta.1"
description = "HDMI-CEC Studio (Windows & Linux / SteamOS)"
authors = ["HDMI-CEC Studio Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.5"
flate2 = "1.1"
crc32fast = "1.5"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_Graphics_Gdi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
