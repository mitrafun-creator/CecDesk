<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>HUD Overlay</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="hud.css" />
</head>
<body>

  <!-- 1. Стандартное всплывающее уведомление (громкость, пресеты, команды) -->
  <div class="hud-card" id="hud-card">
    <div class="hud-icon-box" id="hud-icon">
      <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
    </div>
    <div class="hud-content">
      <div class="hud-title" id="hud-title">HDMI-CEC</div>
      <div class="hud-sub" id="hud-sub" data-hud-i18n="action_done">Действие выполнено</div>
      <div class="hud-bar-bg" id="hud-bar-bg">
        <div class="hud-bar-fill" id="hud-bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- 2. Кокпит активного режима мыши с 3x3 миникартой секторов и подсказками -->
  <div class="mouse-cockpit-card" id="mouse-hud">
    <div class="cockpit-header">
      <div class="cockpit-title-group">
        <div class="cockpit-icon-box">
          <svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="6"></rect><line x1="12" y1="7" x2="12" y2="11"></line></svg>
        </div>
        <span class="cockpit-title" data-hud-i18n="mouse_mode">Режим мыши</span>
        <span class="mouse-status-pill"><span class="pulse-dot"></span><span data-hud-i18n="mouse_active">АКТИВЕН</span></span>
      </div>
      <span class="sector-indicator" id="cockpit-sector-label">Сектор 5 (Центр)</span>
    </div>

    <div class="cockpit-body">
      <!-- Миникарта экрана 3x3 (адаптивные координаты) -->
      <div class="minimap-wrapper">
        <div class="minimap-title" data-hud-i18n="sectors_title">Секторы (1-9)</div>
        <div class="minimap-grid">
          <div class="minimap-cell" id="sector-cell-1">1</div>
          <div class="minimap-cell" id="sector-cell-2">2</div>
          <div class="minimap-cell" id="sector-cell-3">3</div>
          <div class="minimap-cell" id="sector-cell-4">4</div>
          <div class="minimap-cell active-center" id="sector-cell-5">5</div>
          <div class="minimap-cell" id="sector-cell-6">6</div>
          <div class="minimap-cell" id="sector-cell-7">7</div>
          <div class="minimap-cell" id="sector-cell-8">8</div>
          <div class="minimap-cell" id="sector-cell-9">9</div>
        </div>
      </div>

      <!-- Шпаргалка команд пульта -->
      <div class="cheatsheet-wrapper">
        <div class="hint-row">
          <span class="k-badge">OK</span><span class="k-desc" data-hud-i18n="lmb">ЛКМ</span>
          <span class="k-badge" data-hud-i18n="menu_btn">Меню</span><span class="k-desc" data-hud-i18n="rmb">ПКМ</span>
          <span class="k-badge" aria-label="Play"><svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg></span><span class="k-desc" data-hud-i18n="dbl_click">2x Клик</span>
          <span class="k-badge">CH±</span><span class="k-desc" data-hud-i18n="scroll">Скролл</span>
        </div>
        <div class="hint-row">
          <span class="k-badge k-badge-red" data-hud-i18n="red_btn">Красная</span><span class="k-desc">Ctrl+C</span>
          <span class="k-badge k-badge-green" data-hud-i18n="green_btn">Зеленая</span><span class="k-desc">Ctrl+V</span>
          <span class="k-badge k-badge-yellow" data-hud-i18n="yellow_btn">Желтая</span><span class="k-desc">Ctrl+A</span>
        </div>
        <div class="hint-row">
          <span class="k-sub-text" data-hud-i18n="footer_hint">0: Центр • Стрелки: Курсор • 1-9: Прыжок в сектор</span>
        </div>
      </div>
    </div>
  </div>

  <script src="js/hud.js"></script>
</body>
</html>
