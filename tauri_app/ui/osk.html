<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Smart On-Screen Keyboard</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg-glass: rgba(16, 17, 21, 0.96);
      --key-bg: rgba(255, 255, 255, 0.11);
      --key-hover: rgba(255, 255, 255, 0.20);
      --key-active: rgba(255, 255, 255, 0.32);
      --key-special: rgba(255, 255, 255, 0.08);
      --accent: #0A84FF;
      --accent-glow: rgba(90, 200, 250, 0.7);
      --text: #FFFFFF;
      --text-sub: rgba(245, 245, 247, 0.85);
      --border: rgba(255, 255, 255, 0.18);
      --spring: cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
    }

    .osk-wrapper {
      width: 98%;
      max-width: 1030px;
      background: var(--bg-glass);
      backdrop-filter: blur(60px) saturate(200%);
      -webkit-backdrop-filter: blur(60px) saturate(200%);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      padding: 15px 19px;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.90), 0 0 1px rgba(255, 255, 255, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      display: flex;
      flex-direction: column;
      gap: 7px;
      animation: slideUp 0.24s var(--spring);
    }

    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Верхняя плашка подсказок кнопок пульта */
    .osk-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px 5px 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 12px;
      color: var(--text-sub);
    }

    .remote-hints {
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 600;
    }

    .hint-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot-red { background: #FF453A; box-shadow: 0 0 8px rgba(255, 69, 58, 0.8); }
    .dot-green { background: #30D158; box-shadow: 0 0 8px rgba(48, 209, 88, 0.8); }
    .dot-yellow { background: #FFD60A; box-shadow: 0 0 8px rgba(255, 214, 10, 0.8); }
    .dot-blue { background: #0A84FF; box-shadow: 0 0 8px rgba(10, 132, 255, 0.8); }

    .osk-title {
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.02em;
      font-size: 13px;
    }

    .key-red {
      background: rgba(255, 69, 58, 0.22) !important;
      border-color: rgba(255, 69, 58, 0.60) !important;
      color: #FF8A80 !important;
      font-weight: 700;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.18) !important;
    }

    .key-red:hover {
      background: rgba(255, 69, 58, 0.45) !important;
      border-color: #FF453A !important;
      color: #FFFFFF !important;
      box-shadow: 0 0 16px rgba(255, 69, 58, 0.75) !important;
    }

    .key-red.dpad-focus {
      background: #FF453A !important;
      border: 2.2px solid #FF8A80 !important;
      color: #FFFFFF !important;
      box-shadow: 0 0 24px rgba(255, 69, 58, 0.95), 0 5px 16px rgba(0, 0, 0, 0.70) !important;
    }

    /* Ряды клавиш */
    .keyboard-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      width: 100%;
    }

    .key {
      flex: 1;
      height: 50px;
      background: var(--key-bg);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 11px;
      color: var(--text);
      font-size: 17.5px;
      font-weight: 700;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      transition: transform 0.12s var(--spring), background 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    }

    .key:hover {
      background: var(--key-hover);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .key:active, .key.pressed {
      background: var(--key-active);
      transform: scale(0.92);
    }

    /* Курсор навигации с пульта ДУ */
    .key.dpad-focus {
      background: rgba(10, 132, 255, 0.38) !important;
      border: 2.2px solid #5AC8FA !important;
      color: #ffffff !important;
      box-shadow: 0 0 22px rgba(90, 200, 250, 0.75), 0 5px 16px rgba(0, 0, 0, 0.65) !important;
      transform: scale(1.07);
      z-index: 5;
    }

    .key-special {
      background: var(--key-special);
      font-size: 14px;
      font-weight: 600;
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.10);
    }

    .key-w-15 { flex: 1.5; }
    .key-w-17 { flex: 1.7; }
    .key-w-20 { flex: 2.0; }
    .key-w-space { flex: 4.8; font-size: 13.5px; font-weight: 600; letter-spacing: 0.05em; }

    .key-accent {
      background: rgba(10, 132, 255, 0.28);
      border-color: rgba(10, 132, 255, 0.5);
      color: #64D2FF;
      font-weight: 700;
    }

    .key-accent.dpad-focus {
      background: var(--accent) !important;
      color: #ffffff !important;
    }

    .active-toggle {
      background: rgba(48, 209, 88, 0.3) !important;
      border-color: #30D158 !important;
      color: #30D158 !important;
    }
  </style>
</head>
<body>

  <div class="osk-wrapper" id="osk-wrapper">

    <!-- Подсказки кнопок пульта ДУ -->
    <div class="osk-header">
      <div class="remote-hints">
        <span class="hint-chip"><span class="dot dot-red"></span> Красная: Смена языка</span>
        <span class="hint-chip"><span class="dot dot-green"></span> Зеленая: Пробел</span>
        <span class="hint-chip"><span class="dot dot-yellow"></span> Желтая: Стереть</span>
        <span class="hint-chip"><span class="dot dot-blue"></span> Синяя: Ввод</span>
      </div>
      <div class="osk-title" id="osk-lang-badge">Русский (ЙЦУКЕН)</div>
    </div>

    <!-- Контейнер строк клавиатуры -->
    <div id="keyboard-grid" style="display: flex; flex-direction: column; gap: 6px;"></div>

  </div>

  <script>
    const tauri = window.__TAURI__;
    const invoke = tauri ? tauri.core.invoke : null;
    const listen = tauri ? tauri.event.listen : null;

    // Раскладки клавиатуры
    let currentMode = "RU"; // "RU", "EN", "SYM"
    let isCaps = false;
    let isShift = false;
    let focusRow = 2;
    let focusCol = 4;

    const LAYOUT_RU = [
      ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "-", "=", { k: "BACKSPACE", label: "⌫", w: "key-w-15 key-special" }],
      [{ k: "TAB", label: "Tab", w: "key-w-15 key-special" }, "й", "ц", "у", "к", "е", "н", "г", "ш", "щ", "з", "х", "ъ"],
      [{ k: "CAPS", label: "Caps", w: "key-w-17 key-special", id: "key-caps" }, "ф", "ы", "в", "а", "п", "р", "о", "л", "д", "ж", "э", { k: "ENTER", label: "Ввод ↵", w: "key-w-17 key-accent" }],
      [{ k: "SHIFT", label: "Shift ⇧", w: "key-w-17 key-special", id: "key-shift" }, "я", "ч", "с", "м", "и", "т", "ь", "б", "ю", ".", { k: "ESC", label: "Esc", w: "key-w-15 key-special" }],
      [{ k: "MODE_SYM", label: "?123", w: "key-w-15 key-special" }, { k: "MODE_LANG", label: "EN", w: "key-w-15 key-special", id: "btn-lang" }, { k: "SPACE", label: "Пробел", w: "key-w-space" }, { k: "LEFT", label: "◀", w: "key-special" }, { k: "RIGHT", label: "▶", w: "key-special" }, { k: "HIDE", label: "Свернуть ⤓", w: "key-w-15 key-red" }]
    ];

    const LAYOUT_EN = [
      ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "-", "=", { k: "BACKSPACE", label: "⌫", w: "key-w-15 key-special" }],
      [{ k: "TAB", label: "Tab", w: "key-w-15 key-special" }, "q", "w", "e", "r", "t", "y", "u", "i", "o", "p", "[", "]"],
      [{ k: "CAPS", label: "Caps", w: "key-w-17 key-special", id: "key-caps" }, "a", "s", "d", "f", "g", "h", "j", "k", "l", ";", "'", { k: "ENTER", label: "Enter ↵", w: "key-w-17 key-accent" }],
      [{ k: "SHIFT", label: "Shift ⇧", w: "key-w-17 key-special", id: "key-shift" }, "z", "x", "c", "v", "b", "n", "m", ",", ".", "/", { k: "ESC", label: "Esc", w: "key-w-15 key-special" }],
      [{ k: "MODE_SYM", label: "?123", w: "key-w-15 key-special" }, { k: "MODE_LANG", label: "RU", w: "key-w-15 key-special", id: "btn-lang" }, { k: "SPACE", label: "Space", w: "key-w-space" }, { k: "LEFT", label: "◀", w: "key-special" }, { k: "RIGHT", label: "▶", w: "key-special" }, { k: "HIDE", label: "Свернуть ⤓", w: "key-w-15 key-red" }]
    ];

    const LAYOUT_SYM = [
      ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "-", "=", { k: "BACKSPACE", label: "⌫", w: "key-w-15 key-special" }],
      [{ k: "TAB", label: "Tab", w: "key-w-15 key-special" }, "!", "@", "#", "$", "%", "^", "&", "*", "(", ")", "_", "+"],
      [{ k: "MODE_ABC", label: "ABC", w: "key-w-17 key-special" }, "~", "`", "{", "}", ":", "\"", ";", "'", "<", ">", "?", { k: "ENTER", label: "Enter ↵", w: "key-w-17 key-accent" }],
      [{ k: "MODE_ABC", label: "ABC", w: "key-w-17 key-special" }, "[", "]", "\\", "|", "/", ",", ".", "=", "*", "#", { k: "ESC", label: "Esc", w: "key-w-15 key-special" }],
      [{ k: "MODE_ABC", label: "ABC", w: "key-w-15 key-special" }, { k: "MODE_LANG", label: "Язык", w: "key-w-15 key-special" }, { k: "SPACE", label: "Space", w: "key-w-space" }, { k: "LEFT", label: "◀", w: "key-special" }, { k: "RIGHT", label: "▶", w: "key-special" }, { k: "HIDE", label: "Свернуть ⤓", w: "key-w-15 key-red" }]
    ];

    // Аудиокликер (Web Audio API)
    let audioCtx = null;
    function playClickSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(480, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.045);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.045);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch (e) {}
    }

    function getCurrentLayout() {
      if (currentMode === "SYM") return LAYOUT_SYM;
      return currentMode === "RU" ? LAYOUT_RU : LAYOUT_EN;
    }

    function renderKeyboard() {
      const grid = document.getElementById("keyboard-grid");
      grid.innerHTML = "";
      const layout = getCurrentLayout();

      document.getElementById("osk-lang-badge").textContent =
        currentMode === "RU" ? "Русский (ЙЦУКЕН)" : (currentMode === "EN" ? "English (QWERTY)" : "Символы & Цифры");

      layout.forEach((row, rIdx) => {
        const rowEl = document.createElement("div");
        rowEl.className = "keyboard-row";

        row.forEach((item, cIdx) => {
          const btn = document.createElement("div");
          let keyAction = "";
          let label = "";
          let extraClass = "";
          let customId = "";

          if (typeof item === "string") {
            keyAction = item;
            let displayChar = item;
            const upper = (isCaps && !isShift) || (!isCaps && isShift);
            if (upper && /[a-zA-Zа-яА-ЯёЁ]/.test(item)) {
              displayChar = item.toUpperCase();
            }
            label = displayChar;
          } else {
            keyAction = item.k;
            label = item.label;
            extraClass = item.w || "";
            customId = item.id || "";
          }

          btn.className = `key ${extraClass}`;
          btn.textContent = label;
          if (customId) btn.id = customId;

          if (rIdx === focusRow && cIdx === focusCol) {
            btn.classList.add("dpad-focus");
          }

          if (keyAction === "CAPS" && isCaps) btn.classList.add("active-toggle");
          if (keyAction === "SHIFT" && isShift) btn.classList.add("active-toggle");

          btn.onmousedown = (e) => {
            e.preventDefault();
            focusRow = rIdx;
            focusCol = cIdx;
            handleKeyPress(keyAction, label);
            renderKeyboard();
          };

          rowEl.appendChild(btn);
        });

        grid.appendChild(rowEl);
      });
    }

    function getInvoke() {
      const t = window.__TAURI__;
      return t && t.core ? t.core.invoke : (t ? t.invoke : null);
    }

    async function doInvoke(cmd, args) {
      const inv = getInvoke();
      if (inv) {
        try {
          return await inv(cmd, args);
        } catch (e) {
          console.error("OSK invoke err:", e);
        }
      }
    }

    async function handleKeyPress(action, displayLabel) {
      playClickSound();

      if (action === "MODE_LANG") {
        currentMode = (currentMode === "RU") ? "EN" : "RU";
        renderKeyboard();
        return;
      }
      if (action === "MODE_SYM") {
        currentMode = "SYM";
        renderKeyboard();
        return;
      }
      if (action === "MODE_ABC") {
        currentMode = "RU";
        renderKeyboard();
        return;
      }
      if (action === "CAPS") {
        isCaps = !isCaps;
        renderKeyboard();
        return;
      }
      if (action === "SHIFT") {
        isShift = !isShift;
        renderKeyboard();
        return;
      }
      if (action === "HIDE") {
        hideOsk();
        return;
      }

      // Отправка в Rust бэкенд
      if (action === "BACKSPACE" || action === "ENTER" || action === "SPACE" || action === "TAB" || action === "ESC" || action === "LEFT" || action === "RIGHT") {
        await doInvoke("type_special_key", { key: action });
      } else {
        const upper = (isCaps && !isShift) || (!isCaps && isShift);
        let ch = displayLabel;
        if (upper && /[a-zA-Zа-яА-ЯёЁ]/.test(ch)) {
          ch = ch.toUpperCase();
        }
        await doInvoke("type_unicode_char", { ch });
      }

      if (isShift) {
        isShift = false;
        renderKeyboard();
      }
    }

    async function hideOsk() {
      focusRow = 2;
      focusCol = 4;
      isShift = false;
      renderKeyboard();
      await doInvoke("toggle_osk", { force_show: false, forceShow: false });
    }

    // Пространственная (геометрическая) навигация стрелками с пульта ТВ
    function navigateDpad(dir) {
      const layout = getCurrentLayout();
      const numRows = layout.length;

      if (dir === "LEFT") {
        const numCols = layout[focusRow].length;
        focusCol = (focusCol - 1 + numCols) % numCols;
        renderKeyboard();
        return;
      }
      if (dir === "RIGHT") {
        const numCols = layout[focusRow].length;
        focusCol = (focusCol + 1) % numCols;
        renderKeyboard();
        return;
      }

      // Навигация ВВЕРХ / ВНИЗ: находим клавишу в целевом ряду с минимальным
      // горизонтальным смещением относительно центра текущей клавиши
      const rows = document.querySelectorAll(".keyboard-row");
      const currentKey = rows[focusRow]?.children[focusCol];
      let currentCenterX = null;
      if (currentKey) {
        const rect = currentKey.getBoundingClientRect();
        if (rect.width > 0) {
          currentCenterX = rect.left + rect.width / 2;
        }
      }

      const targetRowIdx = dir === "UP" ? (focusRow - 1 + numRows) % numRows : (focusRow + 1) % numRows;
      const targetRowEl = rows[targetRowIdx];

      if (currentCenterX !== null && targetRowEl && targetRowEl.children.length > 0) {
        let bestCol = 0;
        let bestDist = Infinity;
        for (let c = 0; c < targetRowEl.children.length; c++) {
          const kRect = targetRowEl.children[c].getBoundingClientRect();
          const kCenterX = kRect.left + kRect.width / 2;
          const dist = Math.abs(kCenterX - currentCenterX);
          if (dist < bestDist) {
            bestDist = dist;
            bestCol = c;
          }
        }
        focusRow = targetRowIdx;
        focusCol = bestCol;
      } else {
        focusRow = targetRowIdx;
        const numCols = layout[focusRow].length;
        if (focusCol >= numCols) focusCol = numCols - 1;
      }

      renderKeyboard();
    }

    function selectCurrentDpad() {
      const layout = getCurrentLayout();
      const item = layout[focusRow][focusCol];
      if (typeof item === "string") {
        handleKeyPress(item, item);
      } else {
        handleKeyPress(item.k, item.label);
      }
    }

    let lastCmdTime = 0;
    async function setupListener() {
      const t = window.__TAURI__;
      const listen = t && t.event ? t.event.listen : (t ? t.listen : null);
      if (!listen) {
        setTimeout(setupListener, 120);
        return;
      }
      try {
        await listen("osk-state-changed", (ev) => {
          if (!ev.payload) {
            focusRow = 2;
            focusCol = 4;
            isShift = false;
            renderKeyboard();
          }
        });

        await listen("osk-nav", (ev) => {
          const now = Date.now();
          if (now - lastCmdTime < 130) return; // Дебаунс 130 мс против случайных повторов
          lastCmdTime = now;

          const cmd = ev.payload;
          if (cmd === "UP" || cmd === "DOWN" || cmd === "LEFT" || cmd === "RIGHT") {
            navigateDpad(cmd);
          } else if (cmd === "SELECT") {
            selectCurrentDpad();
          } else if (cmd === "LANG") {
            currentMode = (currentMode === "RU") ? "EN" : "RU";
            renderKeyboard();
          } else if (cmd === "BACKSPACE") {
            handleKeyPress("BACKSPACE", "⌫");
          } else if (cmd === "SPACE") {
            handleKeyPress("SPACE", " ");
          } else if (cmd === "ENTER") {
            handleKeyPress("ENTER", "↵");
          }
        });
      } catch (err) {
        console.error("Failed to register osk listeners:", err);
      }
    }

    window.addEventListener("DOMContentLoaded", async () => {
      renderKeyboard();
      setupListener();
    });
  </script>
</body>
</html>
